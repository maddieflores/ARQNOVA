AWSTemplateFormatVersion: '2010-09-09'
Description: Low-cost basic CloudWatch alarms for the temporary ARQNOVA EC2 and RDS resources.

Parameters:
  ProjectName: {Type: String, Default: arqnova}
  Environment: {Type: String, Default: production}
  InstanceId: {Type: AWS::EC2::Instance::Id}
  DatabaseInstanceIdentifier: {Type: String}

Resources:
  InstanceStatusAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ProjectName}-${Environment}-ec2-status
      AlarmDescription: EC2 instance status check failed
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed
      Dimensions: [{Name: InstanceId, Value: !Ref InstanceId}]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: missing
  InstanceCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ProjectName}-${Environment}-ec2-cpu
      AlarmDescription: EC2 sustained CPU can consume T3 unlimited credits
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Dimensions: [{Name: InstanceId, Value: !Ref InstanceId}]
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 80
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: missing
  DatabaseCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ProjectName}-${Environment}-rds-cpu
      AlarmDescription: RDS sustained CPU can consume T4g unlimited credits
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Dimensions: [{Name: DBInstanceIdentifier, Value: !Ref DatabaseInstanceIdentifier}]
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 80
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: missing
  DatabaseFreeStorageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${ProjectName}-${Environment}-rds-free-storage
      AlarmDescription: RDS has less than 5 GiB free storage
      Namespace: AWS/RDS
      MetricName: FreeStorageSpace
      Dimensions: [{Name: DBInstanceIdentifier, Value: !Ref DatabaseInstanceIdentifier}]
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 5368709120
      ComparisonOperator: LessThanThreshold
      TreatMissingData: missing

Outputs:
  AlarmCount: {Value: 4}
